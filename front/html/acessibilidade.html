<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Preferências da sua conta Alertaê.">
    <title>Alertaê — preferências</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/preferencias-compartilhadas.css">
    <link rel="stylesheet" href="../css/acessibilidade.css">
    <script defer src="../js/aplicacao.js"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip"><span class="online-dot"></span><span>Protótipo demonstrativo</span></div>
      <section class="screen active content-screen" aria-label="Acessibilidade">
        <header class="content-header">
          <button class="back-button" type="button" data-screen="settings" aria-label="Voltar às configurações">‹</button>
          <div class="header-title">Acessibilidade</div>
          <div class="header-spacer" aria-hidden="true"></div>
        </header>
        <div class="preferences-page">
          <div class="faq-brand"><span>📍</span><strong>ALERTAÊ</strong></div>
          <h1>Acessibilidade</h1>
          <p class="preferences-intro">Ajuste a tela para ficar mais confortável para você.</p>
          <section class="preference-card">
            <h2>Tamanho do texto</h2>
            <p>Escolha um tamanho mais confortável para ler.</p>
            <div class="choice-row" role="group" aria-label="Tamanho do texto">
              <button class="choice-button" type="button" data-text-size="small">Pequeno</button>
              <button class="choice-button selected" type="button" data-text-size="normal">Padrão</button>
              <button class="choice-button" type="button" data-text-size="large">Grande</button>
            </div>
          </section>
          <section class="preference-card preference-list">
            <h2>Leitura e movimento</h2>
            <label class="preference-row"><div><strong>Alto contraste</strong><small>Aumenta o contraste entre texto e fundo.</small></div><input type="checkbox" data-accessibility="contrast"><i></i></label>
            <label class="preference-row"><div><strong>Reduzir animações</strong><small>Limita os efeitos de transição da interface.</small></div><input type="checkbox" data-accessibility="motion"><i></i></label>
          </section>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
