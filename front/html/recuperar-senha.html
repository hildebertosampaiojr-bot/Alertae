<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Alertaê: alertas, ocorrências e ajuda em tempo real na sua cidade.">
    <title>Alertaê — segurança em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css?v=20261021-mapas">
    <link rel="stylesheet" href="../css/recuperar-senha.css?v=20261021-mapas">
    <script defer src="../js/aplicacao.js?v=20261021-mapas"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip">
        <span class="online-dot">
        </span>
        <span>Protótipo demonstrativo</span>
      </div>
      <section class="screen active content-screen" id="screen-forgot" aria-label="Recuperar senha">
        <header class="content-header">
          <button class="back-button" data-screen="login" aria-label="Voltar">‹</button>
          <div class="header-spacer" aria-hidden="true"></div>
        </header>
        <div class="forgot-content">
          <div class="recovery-icon">✉</div>
          <h1>Esqueceu sua senha?</h1>
          <p>Recuperação demonstrativa: nenhum e-mail será enviado.</p>
          <form class="form-stack" id="forgot-form">
            <label class="field-label" for="forgot-email">E-mail</label>
            <div class="input-wrap">
              <span>✉</span>
              <input id="forgot-email" type="email" placeholder="E-mail" required>
            </div>
            <button class="primary-button" type="submit">Enviar instruções</button>
          </form>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite">
      </div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <span class="modal-emblem">!</span>
          <h2 id="modal-title">Simular pedido de ajuda?</h2>
          <p>Esta é uma demonstração. Nenhum pedido ou localização será enviado a uma central.</p>
          <div class="modal-actions">
            <button class="soft-button" data-close-modal>Cancelar</button>
            <button class="primary-button" id="confirm-sos">Simular SOS</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
