<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Alertaê: alertas, ocorrências e ajuda em tempo real na sua cidade.">
    <title>Alertaê — segurança em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css?v=20261021-mapas">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="../css/mapa.css?v=20261021-mapas">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script defer src="../js/aplicacao.js?v=20261021-mapas"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip">
        <span class="online-dot">
        </span>
        <span>Protótipo demonstrativo</span>
      </div>
      <section class="screen active map-screen" id="screen-map" aria-label="Mapa de ocorrências">
        <header class="map-topbar">
          <div class="mini-brand">
            <span>📍</span>
            <strong>ALERTAÊ</strong>
          </div>
          <button class="avatar-button" data-screen="settings" aria-label="Abrir configurações">L</button>
        </header>
        <div class="map-canvas" aria-label="Mapa interativo com ocorrências">
          <div id="mapa-interativo" role="application" aria-label="Mapa de ruas e ocorrências"></div>
          <button class="locate-button" type="button" aria-label="Centralizar na minha localização atual" title="Minha localização">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="3"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3"/></svg>
          </button>
          <nav class="map-controls" aria-label="Ações do mapa">
            <button class="map-fab sos-fab" type="button" data-screen="sos">
              <i aria-hidden="true">!</i>
              <small>SOS</small>
            </button>
            <button class="map-fab alert-fab" type="button" data-action="alerts" aria-controls="occurrences-sheet" aria-expanded="false" aria-pressed="false">
              <i aria-hidden="true"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg></i>
              <small>Alertas</small>
            </button>
            <button class="map-fab chat-fab" type="button" data-screen="chat">
              <i aria-hidden="true">•••</i>
              <small>Ajuda</small>
            </button>
            <button class="map-fab settings-fab" type="button" data-screen="settings">
              <i aria-hidden="true">⚙</i>
              <small>Config.</small>
            </button>
          </nav>
        </div>
        <div class="map-sheet" id="occurrences-sheet" hidden>
          <button class="sheet-handle" type="button" data-action="toggle-sheet" aria-label="Arraste para ver as últimas notificações" aria-expanded="false"><span></span></button>
          <div class="sheet-heading" data-action="toggle-sheet">
            <strong>Últimas notificações</strong>
            <button class="text-link" data-action="see-all">Ver todas⌃</button>
            <button class="text-link" type="button" data-action="dismiss-alerts" aria-label="Fechar alertas">Fechar</button>
          </div>
          <div class="occurrence-list" id="occurrence-list">
          </div>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite">
      </div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <span class="modal-emblem">!</span>
          <h2 id="modal-title">Simular pedido de ajuda?</h2>
          <p>Esta é uma demonstração. Nenhum pedido ou localização será enviado a uma central.</p>
          <div class="modal-actions">
            <button class="soft-button" data-close-modal>Cancelar</button>
            <button class="primary-button" id="confirm-sos">Simular SOS</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
