<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Preferências da sua conta Alertaê.">
    <title>Alertaê — preferências</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/preferencias-compartilhadas.css">
    <link rel="stylesheet" href="../css/perfil.css">
    <script defer src="../js/aplicacao.js"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip"><span class="online-dot"></span><span>Sistema online</span></div>
      <section class="screen active content-screen" aria-label="Perfil">
        <header class="content-header">
          <button class="back-button" type="button" data-screen="settings" aria-label="Voltar às configurações">‹</button>
          <div class="header-title">Perfil</div>
          <div class="header-spacer" aria-hidden="true"></div>
        </header>
        <div class="preferences-page">
          <div class="faq-brand"><span>📍</span><strong>ALERTAÊ</strong></div>
          <h1>Meu perfil</h1>
          <p class="preferences-intro">Mantenha seus dados de contato atualizados.</p>
          <form class="profile-form preference-card" id="profile-form">
            <label class="field-label" for="profile-name">Nome completo</label>
            <div class="input-wrap"><span aria-hidden="true">♙</span><input id="profile-name" name="name" autocomplete="name" placeholder="Seu nome" required></div>
            <label class="field-label" for="profile-email">E-mail</label>
            <div class="input-wrap"><span aria-hidden="true">✉</span><input id="profile-email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required></div>
            <label class="field-label" for="profile-phone">Telefone</label>
            <div class="input-wrap"><span aria-hidden="true">⌕</span><input id="profile-phone" name="phone" type="tel" autocomplete="tel" placeholder="(00) 00000-0000"></div>
            <button class="primary-button" type="submit">Salvar alterações</button>
          </form>
          <p class="profile-note">Seus dados ficam apenas neste protótipo.</p>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </main>
  </body>
</html>
