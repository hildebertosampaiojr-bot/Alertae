<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Alertaê: alertas, ocorrências e ajuda em tempo real na sua cidade.">
    <title>Alertaê — segurança em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/duvidas-frequentes.css">
    <script defer src="../js/aplicacao.js"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip">
        <span class="online-dot">
        </span>
        <span>Protótipo demonstrativo</span>
      </div>
      <section class="screen active content-screen" id="screen-faq" aria-label="Dúvidas frequentes">
        <header class="content-header">
          <button class="back-button" data-screen="map" aria-label="Voltar">‹</button>
          <div class="header-spacer" aria-hidden="true"></div>
          <button class="header-icon" data-screen="chat" aria-label="Abrir chatbot">•••</button>
        </header>
        <div class="faq-body">
          <div class="faq-brand">
            <span>📍</span>
            <strong>ALERTAÊ</strong>
          </div>
          <h1>Dúvidas Frequentes</h1>
          <p>Encontre respostas para as principais<br>dúvidas sobre o Alertaê.</p>
          <div class="input-wrap search-wrap">
            <span>⌕</span>
            <input id="faq-search" aria-label="Buscar dúvida" placeholder="Buscar uma dúvida...">
          </div>
          <div class="faq-list" id="faq-list">
          </div>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite">
      </div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <span class="modal-emblem">!</span>
          <h2 id="modal-title">Simular pedido de ajuda?</h2>
          <p>Esta é uma demonstração. Nenhum pedido ou localização será enviado a uma central.</p>
          <div class="modal-actions">
            <button class="soft-button" data-close-modal>Cancelar</button>
            <button class="primary-button" id="confirm-sos">Simular SOS</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
