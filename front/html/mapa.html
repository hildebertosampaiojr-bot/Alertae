<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Alertaê: alertas, ocorrências e ajuda em tempo real na sua cidade.">
    <title>Alertaê — segurança em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
    <link rel="stylesheet" href="../css/mapa.css">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script defer src="../js/aplicacao.js"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip">
        <span class="online-dot">
        </span>
        <span>Sistema online</span>
      </div>
      <section class="screen active map-screen" id="screen-map" aria-label="Mapa de ocorrências">
        <header class="map-topbar">
          <div class="mini-brand">
            <span>📍</span>
            <strong>ALERTAÊ</strong>
          </div>
          <button class="avatar-button" data-screen="settings" aria-label="Abrir configurações">L</button>
        </header>
        <div class="map-canvas" aria-label="Mapa interativo com ocorrências">
          <div id="mapa-interativo" role="application" aria-label="Mapa de ruas e ocorrências"></div>
          <div class="map-controls">
            <button class="map-fab sos-fab" data-screen="sos">
              <i aria-hidden="true">!</i>
              <small>SOS</small>
            </button>
            <button class="map-fab alert-fab" data-action="alerts">
              <i aria-hidden="true">♧</i>
              <small>Alertas</small>
            </button>
            <button class="map-fab chat-fab" data-screen="chat">
              <i aria-hidden="true">•••</i>
              <small>Chatbot</small>
            </button>
            <button class="map-fab settings-fab" data-screen="settings">
              <i aria-hidden="true">⚙</i>
              <small>Config.</small>
            </button>
          </div>
          <button class="locate-button" aria-label="Centralizar mapa">◎</button>
        </div>
        <div class="map-sheet" id="occurrences-sheet">
          <button class="sheet-handle" type="button" data-action="toggle-sheet" aria-label="Arraste para ver as últimas notificações" aria-expanded="false"><span></span></button>
          <div class="sheet-heading" data-action="toggle-sheet">
            <strong>Últimas notificações</strong>
            <button class="text-link" data-action="see-all">Ver todas⌃</button>
          </div>
          <div class="occurrence-list" id="occurrence-list">
          </div>
        </div>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite">
      </div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <span class="modal-emblem">!</span>
          <h2 id="modal-title">Pedir ajuda agora?</h2>
          <p>Sua localização será compartilhada com a central de atendimento.</p>
          <div class="modal-actions">
            <button class="soft-button" data-close-modal>Cancelar</button>
            <button class="primary-button" id="confirm-sos">Confirmar SOS</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
