<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="Alertaê: alertas, ocorrências e ajuda em tempo real na sua cidade.">
    <title>Alertaê — segurança em tempo real</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/base.css?v=20261021-acesso">
    <link rel="stylesheet" href="../css/chatbot.css?v=20261021-acesso">
    <script defer src="../js/aplicacao.js?v=20261021-acesso"></script>
  </head>
  <body>
    <main class="device" id="app">
      <div class="status-bar" aria-label="Barra de status">
        <span>9:41</span>
        <div class="status-icons" aria-hidden="true"><i>▮▮▮</i><i>◕</i><i class="battery"></i></div>
      </div>
      <div class="online-strip">
        <span class="online-dot">
        </span>
        <span>Protótipo demonstrativo</span>
      </div>
      <section class="screen active content-screen" id="screen-chat" aria-label="Chatbot Alertaê">
        <header class="content-header">
          <button class="back-button" data-screen="map" aria-label="Voltar">‹</button>
          <div class="header-title">Ajuda do Alertaê</div>
          <button class="header-icon" data-screen="faq" aria-label="Perguntas frequentes">?</button>
        </header>
        <div class="chat-body">
          <div class="bot-card">
            <div class="bot-avatar" role="img" aria-label="Assistente virtual"></div>
            <strong>Como posso<br>ajudar você</strong>
          </div>
          <p class="prompt-label">Você pode perguntar:</p>
          <div class="quick-prompts">
            <button data-prompt="Como faço para denunciar uma situação de risco?" class="quick-prompt">
              <i class="category-icon red">!</i>
              <div>Como faço para denunciar<br>uma situação de risco?</div>
              <b>›</b>
            </button>
            <button data-prompt="Quais são os pontos de risco na minha região?" class="quick-prompt">
              <i class="category-icon amber">⌖</i>
              <div>Quais são os pontos<br>de risco na minha região?</div>
              <b>›</b>
            </button>
            <button data-prompt="Como funciona o Alertaê?" class="quick-prompt">
              <i class="category-icon blue">i</i>
              <div>Como funciona o Alertaê?</div>
              <b>›</b>
            </button>
          </div>
          <div class="chat-messages" id="chat-messages" role="log" aria-live="polite" aria-label="Conversa demonstrativa">
          </div>
        </div>
        <form class="chat-compose" id="chat-form">
          <input id="chat-input" aria-label="Mensagem para o assistente demonstrativo" maxlength="1000" placeholder="Digite sua mensagem..." autocomplete="off">
          <button type="submit" aria-label="Enviar mensagem">➤</button>
        </form>
      </section>
      <div class="toast" id="toast" role="status" aria-live="polite">
      </div>
      <div class="modal-backdrop" id="modal-backdrop" hidden>
        <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
          <span class="modal-emblem">!</span>
          <h2 id="modal-title">Simular pedido de ajuda?</h2>
          <p>Esta é uma demonstração. Nenhum pedido ou localização será enviado a uma central.</p>
          <div class="modal-actions">
            <button class="soft-button" data-close-modal>Cancelar</button>
            <button class="primary-button" id="confirm-sos">Simular SOS</button>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
